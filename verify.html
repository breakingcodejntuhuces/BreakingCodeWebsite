<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Membership | Breaking Code JNTUH UCES</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .digital-card {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    .dc-header {
      background: var(--green);
      color: #fff;
      padding: 16px;
      text-align: center;
      font-weight: 700;
      font-size: 1.2rem;
    }
    .dc-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .dc-profile {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .dc-photo {
      width: 90px;
      height: 110px;
      border-radius: 8px;
      object-fit: cover;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
    }
    .dc-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9rem;
      color: #374151;
    }
    .dc-info strong {
      color: #111827;
    }
    .dc-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }
    .dc-qr {
      width: 100px;
      height: 100px;
    }
    .dc-status {
      text-align: center;
      margin-bottom: 20px;
    }
    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 1rem;
    }
    .status-valid { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .status-invalid { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <div class="logo">
        <img src="assets/images/logo new.jpeg" width="50px" alt="">
        <a href="index.html" class="nav-logo">Breaking Code</a>
      </div>
    </div>
  </nav>

  <section class="reg-section" style="min-height: 80vh; padding: 60px 20px;">
    <div id="verifyContainer" style="max-width: 600px; margin: 0 auto;">
      <div id="loadingState" style="text-align: center; padding: 40px;">
        <p>Verifying Membership...</p>
      </div>

      <div id="resultState" style="display: none;">
        <div class="dc-status">
          <span id="statusBadge" class="status-badge"></span>
        </div>
        
        <div id="cardUI" class="digital-card" style="display: none;">
          <div class="dc-header">
            BREAKING CODE CLUB
          </div>
          <div class="dc-body">
            <div style="text-align: center; margin-bottom: 10px;">
              <span style="background: var(--green); color: white; padding: 4px 16px; border-radius: 99px; font-weight: bold; font-size: 0.9rem;">MEMBER</span>
            </div>
            <div class="dc-profile">
              <img id="dcPhoto" class="dc-photo" src="assets/images/team_placeholder.png" alt="Profile">
              <div class="dc-info">
                <div>Name: <strong id="dcName"></strong></div>
                <div>R. No: <strong id="dcRoll"></strong></div>
                <div>Branch: <strong id="dcBranch"></strong></div>
                <div>Expiry: <strong id="dcExpiry"></strong></div>
              </div>
            </div>
            <div class="dc-bottom">
              <div style="font-weight: bold; font-size: 1.1rem; color: #111827;" id="dcMemId"></div>
              <img id="dcQr" class="dc-qr" src="" alt="QR Code">
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const memId = urlParams.get('id');
      
      const loading = document.getElementById('loadingState');
      const result = document.getElementById('resultState');
      const statusBadge = document.getElementById('statusBadge');
      const cardUI = document.getElementById('cardUI');

      if (!memId) {
        loading.style.display = 'none';
        result.style.display = 'block';
        statusBadge.textContent = 'Invalid QR Code (No ID)';
        statusBadge.className = 'status-badge status-invalid';
        return;
      }

      try {
        const res = await fetch(`/api/verify/${memId}`);
        const data = await res.json();

        loading.style.display = 'none';
        result.style.display = 'block';

        if (res.ok && data.member) {
          statusBadge.textContent = 'Verified Active Member';
          statusBadge.className = 'status-badge status-valid';
          
          cardUI.style.display = 'block';
          document.getElementById('dcName').textContent = data.member.fullName;
          document.getElementById('dcRoll').textContent = data.member.rollNo;
          document.getElementById('dcBranch').textContent = data.member.branch;
          document.getElementById('dcMemId').textContent = data.member.memId;
          
          const expDate = new Date(data.member.expiryDate);
          document.getElementById('dcExpiry').textContent = expDate.toLocaleDateString('en-GB'); 
          
          if(data.member.photoPath) {
             document.getElementById('dcPhoto').src = data.member.photoPath;
          }
          document.getElementById('dcQr').src = data.qrCode;
        } else {
          statusBadge.textContent = 'Invalid or Expired Membership';
          statusBadge.className = 'status-badge status-invalid';
        }
      } catch (err) {
        loading.style.display = 'none';
        result.style.display = 'block';
        statusBadge.textContent = 'Connection Error';
        statusBadge.className = 'status-badge status-invalid';
      }
    });
  </script>
</body>
</html>
